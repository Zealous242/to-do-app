{% load static %}

<!-- Favicon -->
<link
    href="{% static 'favicon/favicon-96x96.png' %}"
    rel="icon"
    sizes="96x96"
    type="image/png"
/>
<link
    href="{% static 'favicon/favicon.svg' %}"
    rel="icon"
    type="image/svg+xml"
/>
<link href="{% static 'favicon/favicon.ico' %}" rel="shortcut icon" />
<link
    href="{% static 'favicon/apple-touch-icon.png' %}"
    rel="apple-touch-icon"
    sizes="180x180"
/>
<meta content="Tend" name="apple-mobile-web-app-title" />
<!-- Stylesheets -->
<link
    crossorigin="anonymous"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    rel="stylesheet"
>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
    rel="stylesheet"
>
<script>document.documentElement.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'</script>
<link href="{% static 'css/base.css' %}" rel="stylesheet">
