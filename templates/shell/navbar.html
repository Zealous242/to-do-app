{% with current=request.resolver_match.namespace %}
<header class="site-nav">
	<nav class="site-nav-inner" aria-label="Main navigation">
		<a href="{% url 'core:home' %}" class="site-nav-brand">to-do</a>

		<div class="site-nav-links">
			<a href="{% url 'core:home' %}" {% if current == 'core' %}aria-current="page"{% endif %}>Home</a>
			{% if user.is_authenticated %}
				<a href="{% url 'accounts:dashboard' %}" {% if current == 'accounts' %}aria-current="page"{% endif %}>Dashboard</a>
				<a href="{% url 'taskgroup:list' %}" {% if current == 'taskgroup' %}aria-current="page"{% endif %}>Projects</a>
				<a href="{% url 'task:create' %}" {% if current == 'task' %}aria-current="page"{% endif %}>New task</a>
			{% endif %}
		</div>

		<div class="site-nav-actions">
			{% if user.is_authenticated %}
				{% if user.is_staff %}
					<a href="{% url 'admin:index' %}">Admin</a>
				{% endif %}
				<form method="post" action="{% url 'account_logout' %}" class="inline-form">
					{% csrf_token %}
					<button type="submit" class="site-nav-button">Sign out</button>
				</form>
			{% else %}
				<a href="{% url 'account_login' %}">Login</a>
				<a href="{% url 'account_signup' %}" class="site-nav-register">Register</a>
			{% endif %}
		</div>
	</nav>
</header>
{% endwith %}
