{% extends "base.html" %}

{% block title %}Delete {{ task.title }} | To Do{% endblock title %}

{% block content %}
    <section aria-labelledby="delete-task-heading">
        <h1 id="delete-task-heading">Delete task</h1>
        <p>Are you sure you want to delete "{{ task.title }}"?</p>
        <form method="post">
            {% csrf_token %}
            {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
            <button type="submit">Delete task</button>
            <a href="{% if next_url %}{{ next_url }}{% else %}{% url 'taskgroup:detail' task.group_id %}{% endif %}">Cancel</a>
        </form>
    </section>
{% endblock content %}
