{% extends "base.html" %}

{% block title %}Edit {{ taskgroup.name }} | To Do{% endblock title %}

{% block content %}
    <section aria-labelledby="edit-project-heading">
        <h1 id="edit-project-heading">Edit project</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save changes</button>
            <a href="{% url 'taskgroup:list' %}">Cancel</a>
        </form>
    </section>
{% endblock content %}
